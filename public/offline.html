<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E4D8C">
  <title>Offline · E-Vuze</title>
  <!-- Served by the service worker when a page can't load. Must stay fully
       self-contained: no external CSS, fonts or scripts. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #F8FBFF; color: #1E3A5F;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 400px; background: #fff; border-radius: 16px; padding: 32px 24px;
      text-align: center; box-shadow: 0 4px 24px rgba(30, 77, 140, 0.08);
    }
    img { width: 72px; height: 72px; border-radius: 16px; }
    .brand { margin: 12px 0 0; font-size: 22px; font-weight: 800; color: #1E4D8C; }
    h1 { margin: 24px 0 8px; font-size: 20px; }
    p { margin: 0; font-size: 15px; line-height: 1.5; color: #4B5563; }
    button {
      margin-top: 24px; width: 100%; min-height: 48px; border: 0; border-radius: 12px;
      background: #2D9B8A; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #1E4D8C; outline-offset: 2px; }
    .hint { margin-top: 12px; font-size: 13px; color: #6B7280; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="">
    <p class="brand">E-Vuze</p>
    <h1>You're offline</h1>
    <p>We can't reach E-Vuze right now. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="hint">This page will reload automatically when you're back online.</p>
  </main>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
